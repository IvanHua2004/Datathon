# Un seul port : l'interface Angular à /, l'API Python relayée à /api/.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sans barre oblique finale : le chemin /api/... est transmis tel quel à FastAPI.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un procès sur Bedrock peut durer plus d'une minute.
        proxy_read_timeout 600s;
    }

    # Routes Angular (/tribunal...) : toujours index.html, le routeur fait le reste.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
