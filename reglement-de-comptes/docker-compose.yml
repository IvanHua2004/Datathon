# Lancer :  docker compose up --build     puis ouvrir http://localhost:4200
#   /           : menu ;  /tribunal : le tribunal (interface Angular)
#   /api/       : l'API Python, relayée par nginx
# Un seul port est ouvert, et seulement sur votre ordinateur (127.0.0.1), pas sur le Wi-Fi.
services:
  api:
    build: .
    image: reglement-de-comptes-api
    # Aucun port publié : seule l'interface (nginx) parle à l'API, à l'intérieur de Docker.
    expose:
      - "8000"
    volumes:
      # Jeu de départ des organisateurs, monté en lecture seule (il n'est pas copié dans l'image)
      - ../Datathon2026/alphaforge_starter:/data:ro
      # Mode Bedrock avec un profil AWS local : décommentez la ligne suivante
      # (seulement si le dossier ~/.aws existe déjà sur votre machine)
      # - ~/.aws:/home/app/.aws:ro
    environment:
      - RDC_DATA_DIR=/data
      # Les variables ci-dessous sont transmises seulement si elles existent dans votre
      # terminal ou dans un fichier .env placé à côté de ce fichier. Sans elles,
      # l'application fonctionne en mode « Sans modèle ».
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_PROFILE
      - BEDROCK_MODEL_ID
      - RDC_S3_BUCKET
      - RDC_S3_PREFIX

  interface:
    build: ./frontend
    image: reglement-de-comptes-interface
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - api
